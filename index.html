<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神社訪問記録</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6d3d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #FAF9F6;
    --ink: #1a1a1a;
    --sub: #777;
    --gold: #8a6d3d;
    --gold-line: #B08D57;
    --border: #e5e2da;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "游明朝", "Yu Mincho", "Hiragino Mincho ProN", serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.4rem 5rem; }
  header { text-align: center; margin-bottom: 1.6rem; }
  header .eyebrow { font-size: 0.72rem; color: var(--sub); letter-spacing: 0.25em; margin: 0 0 0.6rem; }
  header h1 { font-size: 1.5rem; font-weight: 500; margin: 0; letter-spacing: 0.04em; }
  .shrine-name-field {
    margin: 1.6rem auto 0; max-width: 420px;
    border-bottom: 1px solid var(--gold-line); padding-bottom: 0.4rem;
    display: flex; align-items: baseline; gap: 0.6rem; justify-content: center;
  }
  .shrine-name-field label { font-size: 0.8rem; color: var(--sub); white-space: nowrap; }
  .shrine-name-field input {
    flex: 1; border: none; background: transparent; font-family: inherit;
    font-size: 1rem; color: var(--ink); outline: none; text-align: center;
  }
  section { margin-bottom: 2.6rem; }
  .section-title {
    font-size: 1rem; font-weight: 500; color: var(--gold); letter-spacing: 0.08em;
    border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin: 0 0 1rem;
  }
  .section-note { font-size: 0.78rem; color: var(--sub); margin: -0.5rem 0 1rem; }
  ul.check-list { list-style: none; margin: 0; padding: 0; }
  ul.check-list li { border-bottom: 1px dotted var(--border); }
  ul.check-list li:last-child { border-bottom: none; }
  ul.check-list label { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.75rem 0.1rem; cursor: pointer; font-size: 0.92rem; }
  ul.check-list input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 20px; height: 20px; min-width: 20px;
    border: 1px solid var(--gold-line); border-radius: 3px; margin-top: 0.15rem; position: relative; cursor: pointer;
  }
  ul.check-list input[type="checkbox"]:checked { background: var(--gold); border-color: var(--gold); }
  ul.check-list input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  ul.check-list li.checked label span.item-text { color: var(--sub); text-decoration: line-through; text-decoration-color: var(--border); }
  .field-name { color: var(--gold); font-size: 0.8em; letter-spacing: 0.02em; }
  .toolbar {
    position: sticky; top: 0; background: var(--bg); padding: 0.8rem 0;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 0.6rem;
    border-bottom: 1px solid var(--border); margin-bottom: 1rem; z-index: 10;
  }
  .toolbar button {
    font-family: inherit; font-size: 0.76rem; letter-spacing: 0.05em; background: none;
    border: 1px solid var(--gold-line); color: var(--gold); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer;
  }
  .toolbar button:active { background: var(--gold); color: #fff; }
  .toolbar button.danger { border-color: #b5665a; color: #b5665a; }
  .toolbar button.danger:active { background: #b5665a; color: #fff; }
  .toolbar button.back { margin-right: auto; }

  .tab-nav {
    display: flex; gap: 0.5rem; justify-content: center; margin: 0 0 1.8rem;
  }
  .tab-nav button {
    flex: 1; max-width: 220px; font-family: inherit; font-size: 0.82rem; letter-spacing: 0.04em;
    background: none; border: 1px solid var(--border); color: var(--sub);
    padding: 0.6rem 0.4rem; border-radius: 6px; cursor: pointer;
  }
  .tab-nav button.active { border-color: var(--gold); color: var(--gold); background: rgba(138,109,61,0.06); }

  footer { text-align: center; font-size: 0.72rem; color: var(--sub); letter-spacing: 0.05em; margin-top: 3rem; }
  #screen-list .intro { font-size: 0.8rem; color: var(--sub); text-align: center; margin: 0 0 1.8rem; }
  .shrine-card {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px dotted var(--border); padding: 1rem 0.2rem; cursor: pointer; font-family: inherit; color: inherit;
  }
  .shrine-card .name { font-size: 1.02rem; margin-bottom: 0.4rem; }
  .shrine-card .name.empty { color: var(--sub); }
  .shrine-card .meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--sub); margin-bottom: 0.5rem; }
  .shrine-card .tags { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
  .shrine-card .tag {
    font-size: 0.66rem; color: var(--gold); border: 1px solid var(--gold-line);
    border-radius: 999px; padding: 0.1rem 0.6rem; letter-spacing: 0.03em;
  }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--gold); }
  .empty-state { text-align: center; color: var(--sub); font-size: 0.85rem; padding: 2.5rem 1rem; border: 1px dashed var(--border); border-radius: 6px; }
  .add-button {
    display: block; width: 100%; margin-top: 1.6rem; font-family: inherit; font-size: 0.85rem; letter-spacing: 0.05em;
    background: none; border: 1px dashed var(--gold-line); color: var(--gold); padding: 0.9rem; border-radius: 8px; cursor: pointer;
  }
  .add-button:active { background: rgba(138,109,61,0.08); }
  .hidden { display: none !important; }
  .save-hint { text-align: center; font-size: 0.7rem; color: var(--sub); margin-top: -0.5rem; margin-bottom: 1.6rem; min-height: 1em; }
  .storage-warning {
    background: #fdf3ee; border: 1px solid #e3c8bb; color: #8a4a34;
    font-size: 0.78rem; padding: 0.9rem 1rem; border-radius: 6px; margin-bottom: 1.6rem;
  }

  /* ---- 現地記録タブ用のフィールド類 ---- */
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 1rem; margin-bottom: 0.4rem; }
  .meta-grid .full { grid-column: 1 / -1; }
  .field label, .note-field label {
    display: block; font-size: 0.72rem; color: var(--sub); letter-spacing: 0.05em; margin-bottom: 0.3rem;
  }
  .field input[type="text"], .field input[type="date"],
  .note-field input[type="text"], .note-field textarea {
    width: 100%; border: none; border-bottom: 1px solid var(--gold-line);
    background: transparent; font-family: inherit; font-size: 0.92rem; color: var(--ink);
    padding: 0.35rem 0.1rem; outline: none;
  }
  .note-field textarea {
    border: 1px solid var(--border); border-radius: 4px; background: #fff;
    padding: 0.6rem 0.7rem; resize: vertical; min-height: 3.4rem;
  }
  .note-field { margin-bottom: 1.1rem; }
  .pill-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.3rem; }
  .pill-group label {
    display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--ink);
    border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.8rem; cursor: pointer;
  }
  .pill-group input[type="radio"] { accent-color: var(--gold); }
  .check-note-list .item-sub { flex: 1; }
  .check-note-list .item-sub .item-text { display: block; }
  .check-note-list .item-sub input[type="text"] {
    width: 100%; border: none; border-bottom: 1px dotted var(--border); background: transparent;
    font-family: inherit; font-size: 0.82rem; color: var(--sub); padding: 0.25rem 0; margin-top: 0.3rem; outline: none;
  }

  @media print {
    .toolbar, #screen-list, .save-hint, .storage-warning, .tab-nav { display: none !important; }
    #screen-detail .tab-panel.hidden { display: block !important; }
    body { background: #fff; }
    .wrap { padding: 0.5rem; max-width: 100%; }
    section { break-inside: avoid; margin-bottom: 1.4rem; }
    ul.check-list input[type="checkbox"] { border-color: #999; }
    ul.check-list input[type="checkbox"]:checked { background: #fff; }
    ul.check-list input[type="checkbox"]:checked::after { border-color: #333; }
    .note-field textarea, .field input, .note-field input { border-color: #999; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">日本の神社 ご利益ナビ</p>
    <h1 id="page-title">神社訪問記録</h1>
  </header>

  <div id="storage-warning" class="storage-warning hidden">
    このブラウザでは保存機能が使えないため、記録はページを閉じると消えます（プライベートブラウジング中などに起こります）。
  </div>

  <!-- 一覧画面 -->
  <div id="screen-list">
    <p class="intro">訪れた神社ごとに記録を残せます。タップして続きから入力できます。<br>データはこの端末・このブラウザの中だけに保存されます。</p>
    <div id="shrine-list"></div>
    <button class="add-button" id="btn-add">＋ 新しい神社を追加</button>
  </div>

  <!-- 詳細画面 -->
  <div id="screen-detail" class="hidden">
    <div class="toolbar">
      <button class="back" id="btn-back">← 一覧に戻る</button>
      <button id="btn-print">印刷する</button>
      <button id="btn-reset">このタブをリセット</button>
      <button class="danger" id="btn-delete">この神社を削除</button>
    </div>

    <div class="shrine-name-field">
      <label for="shrine-name">神社名</label>
      <input id="shrine-name" type="text" placeholder="（記入してください）">
    </div>
    <p class="save-hint" id="save-hint">&nbsp;</p>

    <div class="tab-nav">
      <button id="tab-btn-visit" class="active">① 現地記録</button>
      <button id="tab-btn-checklist">② 記事作成チェックリスト</button>
    </div>

    <div id="panel-visit" class="tab-panel"></div>
    <div id="panel-checklist" class="tab-panel hidden"></div>

    <footer>日本の神社 ご利益ナビ　訪問記録＋制作メモ</footer>
  </div>

</div>

<script>
  // =========================================================
  // ① 現地記録（参拝中にその場で入力する項目）
  // =========================================================
  const VISIT_META = [
    { id: "v_date", type: "date", label: "参拝日" },
    { id: "v_weather", type: "text", label: "天候", placeholder: "例：晴れ、風あり" },
    { id: "v_timeband", type: "radio", label: "時間帯", name: "v_timeband", options: ["早朝", "日中", "夕方", "夜"] },
  ];

  const VISIT_SECTIONS = [
    {
      title: "由緒書き・案内板",
      note: "史料A・Bのもとになる部分。案内板があれば必ず写真に撮る。",
      fields: [
        { id: "v_chk_signage", type: "check", label: "由緒書き・案内板を撮影した" },
        { id: "v_chk_map", type: "check", label: "境内図・地図があれば撮影した" },
        { id: "v_saijin", type: "text", label: "御祭神（案内板に書かれている神名を書き写す）" },
        { id: "v_yuisho", type: "textarea", label: "由緒の要点メモ（創建、伝承、気になった記述など）" },
      ],
    },
    {
      title: "境内の体感",
      note: "「地形・風土的背景」のもとになる、その場でしか分からない感覚。",
      fields: [
        { id: "v_sando", type: "text", label: "参道の特徴（石段の数、坂や道の通称など）" },
        { id: "v_crowd", type: "radio", label: "混雑具合", name: "v_crowd", options: ["空いていた", "ほどほど", "賑わっていた", "身動き取れないほど"] },
        { id: "v_kisetsu", type: "textarea", label: "季節・自然・空気感のメモ（花、木、匂い、音など）" },
      ],
    },
    {
      title: "アクセス",
      fields: [
        { id: "v_parking1", type: "text", label: "駐車場の位置・台数" },
        { id: "v_parking2", type: "text", label: "駐車場で気づいた注意点（舗装、混雑時間帯など）" },
        { id: "v_walk", type: "text", label: "最寄り駅・バス停からの徒歩時間（実測）" },
        { id: "v_drive", type: "text", label: "運転で気になった点（道幅、方面別の来やすさなど）" },
        { id: "v_chk_geo", type: "check", label: "Googleマップで位置情報（緯度・経度）を確認した" },
      ],
    },
    {
      title: "社頭点景（見どころ）撮影チェック",
      note: "撮った項目にチェック。右の欄に一言メモ（何が特徴的か）を残す。",
      checkNoteList: true,
      fields: [
        { id: "v_spot_torii", type: "checknote", label: "鳥居" },
        { id: "v_spot_haiden", type: "checknote", label: "拝殿・本殿" },
        { id: "v_spot_komainu", type: "checknote", label: "狛犬" },
        { id: "v_spot_shinboku", type: "checknote", label: "御神木・名木" },
        { id: "v_spot_toro", type: "checknote", label: "灯籠・石碑・伝承の石" },
        { id: "v_spot_other", type: "checknote", label: "その他", placeholder: "何を撮ったか＋一言メモ" },
      ],
    },
    {
      title: "授与品",
      fields: [
        { id: "v_chk_juyohin", type: "check", label: "お守り・おみくじの写真を撮った" },
        { id: "v_juyohin_note", type: "textarea", label: "名称・特徴・値段のメモ" },
      ],
    },
    {
      title: "一言メモ",
      note: "記事の書き出しに使える、その場だけの気づき・体験談。",
      fields: [
        { id: "v_memo", type: "textarea", label: null },
      ],
    },
  ];

  // =========================================================
  // ② 記事作成チェックリスト（帰宅後・執筆時に使う既存のACFベースの項目）
  // =========================================================
  const SECTIONS = [
    { title: "基本情報", items: [
      { id: "b1", label: "タイトルを入力（神社の正式名称）" },
      { id: "b2", label: "スラッグを確認" },
      { id: "b3", label: "カテゴリー・タグを設定" },
    ]},
    { title: "写真まわり", items: [
      { id: "p1", label: '<span class="field-name">shrine_photo</span>　メイン写真をアップロード' },
      { id: "p2", label: '<span class="field-name">shrine_photo_caption</span>　写真の一言キャプション' },
    ]},
    { title: "導入・ご利益", items: [
      { id: "i1", label: '<span class="field-name">topography</span>　地形・風土的背景（現地の体感を含める）' },
      { id: "i2", label: '<span class="field-name">blessing_reason</span>　ご利益の起源・理由' },
    ]},
    { title: "授与品（任意）", items: [
      { id: "j1", label: '<span class="field-name">juyohin_photo</span>　授与品の写真' },
      { id: "j2", label: '<span class="field-name">juyohin_note</span>　授与品の紹介文' },
    ]},
    { title: "アクセス", items: [
      { id: "a1", label: '<span class="field-name">parking_info</span>　駐車場情報' },
      { id: "a2", label: '<span class="field-name">driver_advice</span>　運転のコツ' },
      { id: "a3", label: '<span class="field-name">train_access</span>　公共交通機関でのアクセス' },
      { id: "a4", label: '<span class="field-name">shrine_lat / shrine_lng</span>　緯度・経度' },
    ]},
    { title: "史料（サイトの核）", items: [
      { id: "h1", label: '<span class="field-name">history_official</span>　史料A・公式史料/記紀' },
      { id: "h2", label: '<span class="field-name">history_shrine</span>　史料B・社伝/地域伝承' },
      { id: "h3", label: '<span class="field-name">history_ancient</span>　史料C・古史古伝/独自考察' },
    ]},
    { title: "社頭点景（ギャラリー）", items: [
      { id: "g1", label: '<span class="field-name">gallery_tagline</span>　キャッチコピーを確認・調整' },
      { id: "g2", label: "ギャラリーブロックに写真を追加（クラス：shrine-gallery）" },
      { id: "g3", label: "各写真にキャプションを入力" },
    ]},
    { title: "タクソノミー（分類）", items: [
      { id: "t1", label: "御祭神：該当する神名をすべてチェック" },
      { id: "t2", label: "ご利益：該当するものをすべてチェック" },
      { id: "t3", label: "都道府県：必ず設定" },
    ]},
    { title: "本文の配置", items: [
      { id: "m1", label: '<span class="field-name">[shrine_profile]</span>　を配置' },
      { id: "m2", label: '<span class="field-name">[shrine_gallery_intro]</span>　を配置' },
    ]},
    { title: "公開前の最終確認", items: [
      { id: "f1", label: "実際に公開/更新した状態でフロント画面を確認" },
      { id: "f2", label: "地図のピン位置が正しいか確認" },
      { id: "f3", label: "スマートフォン表示の崩れを確認" },
      { id: "f4", label: "用語集・関連神社と相互リンクを設置" },
      { id: "f5", label: "該当するハブ記事にこの神社へのリンクを追加" },
    ], note: "断定を避け、史料と考察は分けて書く。実際に参拝した神社は一次情報（体感）を1つ入れる。" },
  ];
  const ITEM_COUNT = SECTIONS.reduce((sum, s) => sum + s.items.length, 0);
  const STORAGE_KEY = "shrine-entries-offline";

  // ---------- 状態 ----------
  let entries = [];
  let currentId = null;
  let storageOK = true;
  let currentTab = "visit"; // "visit" | "checklist"

  // ---------- 保存・読み込み（localStorage） ----------
  function checkStorage() {
    try {
      const testKey = "__test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }
  function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      // 旧データ（visitフィールドが無い）にも安全にデフォルトを補う
      return parsed.map(e => ({ checks: {}, visit: {}, ...e }));
    } catch (e) {
      console.error("load error", e);
      return [];
    }
  }
  function saveEntries() {
    const hint = document.getElementById("save-hint");
    if (!storageOK) {
      if (hint) hint.textContent = " ";
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      if (hint) { hint.textContent = "保存しました"; setTimeout(() => { if (hint.textContent === "保存しました") hint.textContent = " "; }, 1200); }
    } catch (e) {
      if (hint) hint.textContent = "保存できませんでした（保存容量が一杯の可能性があります）";
      console.error("save error", e);
    }
  }

  // =========================================================
  // 現地記録タブの描画
  // =========================================================
  function renderMetaField(f) {
    if (f.type === "date" || f.type === "text") {
      return `
        <div class="field">
          <label for="${f.id}">${f.label}</label>
          <input id="${f.id}" type="${f.type}" data-visit-id="${f.id}" ${f.placeholder ? `placeholder="${f.placeholder}"` : ""}>
        </div>`;
    }
    if (f.type === "radio") {
      const opts = f.options.map((label, i) => `
        <label><input type="radio" name="${f.name}" data-visit-id="${f.id}" value="${escapeHTML(label)}">${escapeHTML(label)}</label>
      `).join("");
      return `
        <div class="field full">
          <label>${f.label}</label>
          <div class="pill-group">${opts}</div>
        </div>`;
    }
    return "";
  }

  function renderVisitField(f) {
    if (f.type === "check") {
      return `
        <li><label>
          <input type="checkbox" data-visit-id="${f.id}">
          <span class="item-text">${f.label}</span>
        </label></li>`;
    }
    if (f.type === "text") {
      return `
        <div class="note-field">
          <label>${f.label}</label>
          <input type="text" data-visit-id="${f.id}">
        </div>`;
    }
    if (f.type === "textarea") {
      return `
        <div class="note-field">
          ${f.label ? `<label>${f.label}</label>` : ""}
          <textarea data-visit-id="${f.id}" ${f.label ? "" : 'style="min-height:5rem;"'}></textarea>
        </div>`;
    }
    if (f.type === "radio") {
      const opts = f.options.map(label => `
        <label><input type="radio" name="${f.id}" data-visit-id="${f.id}" value="${escapeHTML(label)}">${escapeHTML(label)}</label>
      `).join("");
      return `
        <div class="note-field">
          <label>${f.label}</label>
          <div class="pill-group">${opts}</div>
        </div>`;
    }
    if (f.type === "checknote") {
      return `
        <li><label>
          <input type="checkbox" data-visit-id="${f.id}_chk">
          <span class="item-sub">
            <span class="item-text">${f.label}</span>
            <input type="text" data-visit-id="${f.id}_note" placeholder="${f.placeholder || "一言メモ"}">
          </span>
        </label></li>`;
    }
    return "";
  }

  function buildVisitHTML() {
    const metaHTML = `<div class="meta-grid">${VISIT_META.map(renderMetaField).join("")}</div>`;
    const sectionsHTML = VISIT_SECTIONS.map(sec => {
      const note = sec.note ? `<p class="section-note">${sec.note}</p>` : "";
      const checkFields = sec.fields.filter(f => f.type === "check" || f.type === "checknote");
      const otherFields = sec.fields.filter(f => f.type !== "check" && f.type !== "checknote");
      const listHTML = checkFields.length
        ? `<ul class="check-list${sec.checkNoteList ? " check-note-list" : ""}">${checkFields.map(renderVisitField).join("")}</ul>`
        : "";
      const othersHTML = otherFields.map(renderVisitField).join("");
      return `
        <section>
          <p class="section-title">${sec.title}</p>
          ${note}
          ${listHTML}
          ${othersHTML}
        </section>`;
    }).join("");
    return metaHTML + sectionsHTML;
  }

  function applyVisitToDOM(visit) {
    const v = visit || {};
    document.querySelectorAll('#panel-visit [data-visit-id]').forEach(el => {
      const id = el.dataset.visitId;
      if (el.type === "checkbox") {
        const on = !!v[id];
        el.checked = on;
        const li = el.closest("li");
        if (li) li.classList.toggle("checked", on);
      } else if (el.type === "radio") {
        el.checked = v[id] === el.value;
      } else {
        el.value = v[id] || "";
      }
    });
  }

  // =========================================================
  // 記事作成チェックリストタブの描画（既存機能そのまま）
  // =========================================================
  function buildChecklistHTML() {
    return SECTIONS.map(sec => {
      const items = sec.items.map(it => `
        <li>
          <label>
            <input type="checkbox" data-id="${it.id}">
            <span class="item-text">${it.label}</span>
          </label>
        </li>`).join("");
      const note = sec.note ? `<p class="section-note">${sec.note}</p>` : "";
      return `
        <section>
          <p class="section-title">${sec.title}</p>
          <ul class="check-list">${items}</ul>
          ${note}
        </section>`;
    }).join("");
  }
  function applyChecksToDOM(checks) {
    document.querySelectorAll('#panel-checklist input[type="checkbox"]').forEach(box => {
      const id = box.dataset.id;
      const on = !!checks[id];
      box.checked = on;
      box.closest("li").classList.toggle("checked", on);
    });
  }

  // ---------- 一覧画面 ----------
  function progressOf(entry) {
    const checked = Object.values(entry.checks || {}).filter(Boolean).length;
    return { checked, total: ITEM_COUNT };
  }
  function hasVisitData(entry) {
    const v = entry.visit || {};
    return Object.values(v).some(val => val === true || (typeof val === "string" && val.trim() !== ""));
  }
  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
  }
  function renderList() {
    const list = document.getElementById("shrine-list");
    if (entries.length === 0) {
      list.innerHTML = `<div class="empty-state">まだ記録がありません。<br>「＋ 新しい神社を追加」から始めましょう。</div>`;
      return;
    }
    const sorted = [...entries].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    list.innerHTML = sorted.map(e => {
      const { checked, total } = progressOf(e);
      const pct = Math.round((checked / total) * 100);
      const name = e.name && e.name.trim() ? e.name : "（名称未設定）";
      const nameClass = e.name && e.name.trim() ? "name" : "name empty";
      const visitTag = hasVisitData(e) ? `<span class="tag">現地記録あり</span>` : "";
      return `
        <button class="shrine-card" data-id="${e.id}">
          <div class="${nameClass}">${escapeHTML(name)}</div>
          <div class="tags">${visitTag}</div>
          <div class="meta"><span>チェックリスト ${checked} / ${total}</span><span>更新: ${formatDate(e.updatedAt)}</span></div>
          <div class="progress-bar"><span style="width:${pct}%"></span></div>
        </button>`;
    }).join("");
    list.querySelectorAll(".shrine-card").forEach(btn => {
      btn.addEventListener("click", () => openDetail(btn.dataset.id));
    });
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- タブ切り替え ----------
  function showTab(tab) {
    currentTab = tab;
    document.getElementById("panel-visit").classList.toggle("hidden", tab !== "visit");
    document.getElementById("panel-checklist").classList.toggle("hidden", tab !== "checklist");
    document.getElementById("tab-btn-visit").classList.toggle("active", tab === "visit");
    document.getElementById("tab-btn-checklist").classList.toggle("active", tab === "checklist");
  }

  // ---------- 画面切り替え ----------
  function showList() {
    currentId = null;
    document.getElementById("screen-list").classList.remove("hidden");
    document.getElementById("screen-detail").classList.add("hidden");
    document.getElementById("page-title").textContent = "神社訪問記録";
    renderList();
  }
  function openDetail(id) {
    const entry = entries.find(e => e.id === id);
    if (!entry) return;
    currentId = id;
    document.getElementById("screen-list").classList.add("hidden");
    document.getElementById("screen-detail").classList.remove("hidden");
    document.getElementById("page-title").textContent = "神社記録";
    document.getElementById("shrine-name").value = entry.name || "";
    applyVisitToDOM(entry.visit || {});
    applyChecksToDOM(entry.checks || {});
    document.getElementById("save-hint").textContent = " ";
    showTab("visit");
  }

  // ---------- イベント ----------
  document.getElementById("btn-add").addEventListener("click", () => {
    const entry = { id: "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "", checks: {}, visit: {}, updatedAt: Date.now() };
    entries.push(entry);
    saveEntries();
    openDetail(entry.id);
  });
  document.getElementById("btn-back").addEventListener("click", showList);
  document.getElementById("btn-print").addEventListener("click", () => window.print());
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (!currentId) return;
    const label = currentTab === "visit" ? "現地記録" : "記事作成チェックリスト";
    if (!confirm(`「${label}」タブの内容をすべてリセットします。よろしいですか？`)) return;
    const entry = entries.find(e => e.id === currentId);
    if (currentTab === "visit") {
      entry.visit = {};
      applyVisitToDOM(entry.visit);
    } else {
      entry.checks = {};
      applyChecksToDOM(entry.checks);
    }
    entry.updatedAt = Date.now();
    saveEntries();
  });
  document.getElementById("btn-delete").addEventListener("click", () => {
    if (!currentId) return;
    if (!confirm("この神社の記録を削除します。元に戻せません。よろしいですか？")) return;
    entries = entries.filter(e => e.id !== currentId);
    saveEntries();
    showList();
  });
  document.getElementById("tab-btn-visit").addEventListener("click", () => showTab("visit"));
  document.getElementById("tab-btn-checklist").addEventListener("click", () => showTab("checklist"));

  document.getElementById("shrine-name").addEventListener("input", (e) => {
    if (!currentId) return;
    const entry = entries.find(x => x.id === currentId);
    entry.name = e.target.value;
    entry.updatedAt = Date.now();
    clearTimeout(window.__nameSaveTimer);
    window.__nameSaveTimer = setTimeout(saveEntries, 500);
  });

  document.getElementById("panel-checklist").addEventListener("change", (e) => {
    if (e.target.matches('input[type="checkbox"]')) {
      if (!currentId) return;
      const entry = entries.find(x => x.id === currentId);
      const id = e.target.dataset.id;
      entry.checks = entry.checks || {};
      entry.checks[id] = e.target.checked;
      entry.updatedAt = Date.now();
      e.target.closest("li").classList.toggle("checked", e.target.checked);
      saveEntries();
    }
  });

  let visitSaveTimer = null;
  function handleVisitFieldChange(e) {
    const el = e.target.closest("[data-visit-id]");
    if (!el || !currentId) return;
    const entry = entries.find(x => x.id === currentId);
    entry.visit = entry.visit || {};
    const id = el.dataset.visitId;
    if (el.type === "checkbox") {
      entry.visit[id] = el.checked;
      const li = el.closest("li");
      if (li) li.classList.toggle("checked", el.checked);
    } else if (el.type === "radio") {
      entry.visit[id] = el.value;
    } else {
      entry.visit[id] = el.value;
    }
    entry.updatedAt = Date.now();
    clearTimeout(visitSaveTimer);
    visitSaveTimer = setTimeout(saveEntries, 400);
  }
  document.getElementById("panel-visit").addEventListener("input", handleVisitFieldChange);
  document.getElementById("panel-visit").addEventListener("change", handleVisitFieldChange);

  // ---------- 初期化 ----------
  (function init() {
    storageOK = checkStorage();
    if (!storageOK) document.getElementById("storage-warning").classList.remove("hidden");
    document.getElementById("panel-visit").innerHTML = buildVisitHTML();
    document.getElementById("panel-checklist").innerHTML = buildChecklistHTML();
    entries = loadEntries();
    showList();
  })();

  // ---------- PWA: service worker登録（https公開後に有効化されます） ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((e) => console.log("SW registration skipped:", e));
    });
  }
</script>

</body>
</html>
